# Build and push the app image to GitHub Container Registry (ghcr.io).
# Required for `docker pull ghcr.io/<owner>/<repo>`.
name: Docker publish

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Registry owner (GHCR namespace is lowercase)
        id: owner
        shell: bash
        run: echo "name=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Grant workflow write access to GHCR package
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PKG: pipeline-monitor
          REPO_ID: ${{ github.repository_id }}
          OWNER: ${{ steps.owner.outputs.name }}
        run: |
          set -euo pipefail
          body='{"permission":"write"}'
          for path in \
            "user/packages/container/${PKG}/repositories/${REPO_ID}" \
            "orgs/${OWNER}/packages/container/${PKG}/repositories/${REPO_ID}"; do
            if gh api -X PUT "${path}" --input - <<<"${body}" 2>/dev/null; then
              echo "Linked repository to package via /${path}"
              exit 0
            fi
          done
          echo "Package ACL not updated (package may not exist yet, or token lacks package admin)."

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ steps.owner.outputs.name }}
          password: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Image name (lowercase for ghcr.io)
        id: image
        shell: bash
        run: |
          r="${GITHUB_REPOSITORY,,}"
          echo "img=${{ env.REGISTRY }}/${r}" >> "$GITHUB_OUTPUT"

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ steps.image.outputs.img }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' }}
            type=semver,pattern={{version}}
            type=ref,event=tag
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
