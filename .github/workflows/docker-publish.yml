# Build and push the app image to GitHub Container Registry (ghcr.io).
# Required for `docker pull ghcr.io/<owner>/<repo>`.
#
# If push fails with `permission_denied: write_package`, also check in GitHub UI:
# - Repo Settings → Actions → General → Workflow permissions → Read and write
# - Packages → pipeline-monitor → Package settings → Manage Actions access → this repo (Write)
# Optional: add repo secret GHCR_TOKEN (classic PAT with write:packages) if org caps GITHUB_TOKEN.
name: Docker publish

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}

      # Docker / GHCR require a fully lowercase image name. github.repository may be mixed case.
      - name: Image name (lowercase for ghcr.io)
        id: image
        shell: bash
        run: |
          r="${GITHUB_REPOSITORY,,}"
          echo "img=${{ env.REGISTRY }}/${r}" >> "$GITHUB_OUTPUT"

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ steps.image.outputs.img }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' }}
            type=semver,pattern={{version}}
            type=ref,event=tag
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
